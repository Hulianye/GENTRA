# Fixed epoch-20 downstream full fine-tuning scenarios.
defaults:
  seed: 0
  finetune_strategy: full
  optimizer_type: adamw
  label_smoothing: 0.0
  use_amp: false
  cudnn_benchmark: false
  data_workers: 1
  dataloader_workers: 0
  epochs: 20
  l_freq: 8.0
  h_freq: 32.0
  target_fs: 250
  time_length: 4.0
  apply_EA: true
  use_lr_scheduler: true
  use_wd_scheduler: false
  lr_warmup_epochs: 0
  lr_decay_start_epoch: 1
  min_lr_ratio: 0.01
  wd_decay_start_epoch: 1
  filter_bias_and_bn: true
  opt_eps: 1.0e-08
  b1: 0.9
  b2: 0.999
  clip_grad_norm: 1.0
  class_weights: false
cross:
- name: BNCI2014001_Cross_4class
  dataset: BNCI2014001
  train_percentage: 0.8
  batch_size: 128
  dropout_rate: 0.3
  num_classes: 4
  train_classes:
  - 0
  - 1
  - 2
  - 3
  lr: 1.0e-05
  weight_decay: 0.001
  norm_method: car
  min_lr: 1.0e-05
  final_weight_decay: 0.001
  expected_folds: 9
  cache_filename: BNCI2014001_Cross_4class.pkl
